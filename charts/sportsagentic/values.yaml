replicaCount: 1

image:
  repository: ghcr.io/tmonteith/sportsagentic
  pullPolicy: IfNotPresent
  # Keep this quoted, and use --set-string for an all-digit git SHA
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "sportsagentic"

config:
  port: "8080"
  mode: "sse"

# Required: set existingSecret in production, or cfbdApiKey for a throwaway install
secrets:
  existingSecret: ""
  existingSecretKey: "CFBD_API_KEY"
  cfbdApiKey: ""

# Optional: enables the lakehouse analytics tools (get_team_analytics, get_game_summary).
# existingSecret names a Secret holding the GCP service account key under key.json
# (gcp-key-mcp-server); it is mounted read-only at /var/secrets/gcp/key.json.
# project is the GCP project ID and is required when existingSecret is set.
# Leave existingSecret empty to run only the live CFBD tools.
gcp:
  existingSecret: ""
  project: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mcp.sportagentic.dev
      paths:
        - path: /
          pathType: Prefix
  tls: []

livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
